name = "waylo"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- D1 ---------------------------------------------------------------
# database_id fylls i av scripts/setup-cloudflare.sh (eller manuellt efter
# `wrangler d1 create waylo`).
[[d1_databases]]
binding = "DB"
database_name = "waylo"
database_id = "DITT-D1-ID-HÄR"

# --- R2 (bilder + GPX) ------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "waylo-media"

# --- KV (cache) -------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "DITT-KV-ID-HÄR"

[vars]
ENVIRONMENT = "production"
INSTANS_ID = "inst-arctic-lodge"
CLAUDE_MODEL = "claude-sonnet-4-6"
MEDIA_BASE_URL = "https://media.arcticlodge.nu"
# Kommaseparerad lista, tom = tillåt alla (använd endast för test)
ALLOWED_ORIGINS = "https://arcticlodge.nu,https://www.arcticlodge.nu"

# Hemligheter (sätts med `wrangler secret put`, ALDRIG här):
#   ANTHROPIC_API_KEY
