name = "waylo"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- D1 ---------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "waylo"
database_id = "4f8f8f68-ac34-4d34-a108-6de70fbcb873"
# Numrerade migreringar körs av deploy-scriptet, en gång var.
migrations_dir = "../../schema/migrations"

# --- R2 (bilder + GPX) ------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "waylo-media"

# --- KV (cache) -------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "5b7afa45e2784be7b0e63e1a1f6df72a"

[vars]
ENVIRONMENT = "production"
INSTANS_ID = "inst-arctic-lodge"
CLAUDE_MODEL = "claude-sonnet-4-6"
MEDIA_BASE_URL = "https://media.arcticlodge.nu"
# Kommaseparerad lista, tom = tillåt alla (använd endast för test)
ALLOWED_ORIGINS = "https://arcticlodge.nu,https://www.arcticlodge.nu"

# Hemligheter (sätts med `wrangler secret put`, ALDRIG här):
#   ANTHROPIC_API_KEY
