name = "waylo-tiles"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Samma KV-namespace som api-workern (id fylls i av setup-scriptet).
[[kv_namespaces]]
binding = "CACHE"
id = "5b7afa45e2784be7b0e63e1a1f6df72a"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = ""   # tom = tillåt alla (tiles är publika CC0-data)
# Upstream-URL, {z}/{x}/{y} ersätts per tile. Tom = Lantmäteriets
# avgiftsfria topowebb-ccby. Byt här när tjänsten utgår 2026-12-31.
WMTS_URL = ""

# Hemlighet (sätts först när avgiftsfria tjänsten utgår 2026-12-31):
#   LANTMATERIET_TOKEN
