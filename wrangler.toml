# En enda Worker serverar allt: den byggda React-appen som statiska
# assets, chatbot-API:t och kartrutorna. Root directory i Cloudflare
# är repo-roten — inget att ställa in.

name = "waylo"
main = "worker/src/index.js"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

# --- Frontend som statiska assets ------------------------------------
# Filer som finns här serveras utan att workern körs. Vägar utan
# matchande fil går till workern, som lämnar tillbaka icke-API-vägar
# hit igen så att klientsidans routing fungerar.
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Utan detta tar assets-lagret hand om allt som inte är en fil och
# svarar med index.html — även /health och /tiles, så workern körs
# aldrig. De här vägarna går till workern först; allt annat till assets.
run_worker_first = [
  "/health",
  "/instans",
  "/poi",
  "/poi/*",
  "/kategorier",
  "/chat",
  "/tiles/*",
]

# --- D1 ---------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "waylo"
database_id = "4f8f8f68-ac34-4d34-a108-6de70fbcb873"
# Numrerade migreringar körs av deploy-scriptet, en gång var.
migrations_dir = "schema/migrations"

# --- R2 (bilder + GPX) ------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "waylo-media"

# --- KV (tile-cache + instanskonfig) ----------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "5b7afa45e2784be7b0e63e1a1f6df72a"

[vars]
ENVIRONMENT = "production"
INSTANS_ID = "inst-arctic-lodge"
# Byt modell utan kodändring.
CLAUDE_MODEL = "claude-sonnet-4-6"
MEDIA_BASE_URL = "https://media.arcticlodge.nu"
# Sajten ligger på samma origin som API:t, så det här gäller bara
# WordPress-widgeten. Tom lista = tillåt alla.
ALLOWED_ORIGINS = "https://arcticlodge.nu,https://www.arcticlodge.nu"
# Kartlager: topowebb eller topowebb_nedtonad. Det nedtonade lagret
# konkurrerar mindre med POI-markörerna.
WMTS_LAGER = "topowebb"

# Full upstream-URL för kartrutorna. Tom = Lantmäteriets topowebb-ccby
# enligt deras egen ResourceURL-mall. Sätt den här för att peka någon
# annanstans — {z}/{x}/{y} och {token} ersätts per anrop.
WMTS_URL = ""

# Norska Kartverket täcker det Lantmäteriet inte gör. Gratis och utan
# inloggning. Lager: topo, topograatone, toporaster (turkart),
# sjokartraster. Riksgränsen ligger på gränsen, så norska fjällen syns
# bara tack vare det här.
KARTVERKET_LAGER = "topo"
KARTVERKET_URL = ""

# Sitter Kartverkets rutor i fel skala är deras nivånumrering förskjuten
# mot Leaflets. Sätt -1 eller 1. Kontrollera först under rutnat i
# /tiles/capabilities?kalla=no — står googlemapscompatible: true ligger
# felet någon annanstans och det här ska lämnas på 0.
KARTVERKET_ZOOM_OFFSET = "0"

# Lantmäteriet svarar 200 med en tom vit ruta utanför svensk täckning
# istället för ett fel. Rutor mindre än så här räknas som tomma och
# hämtas från Kartverket istället. Mät med X-Tile-Bytes om gränsen
# behöver justeras.
TOM_RUTA_BYTES = "1500"

# Inloggning mot Lantmäteriet. maps.lantmateriet.se svarar med en
# nginx-401, alltså HTTP Basic — därför "basic". Tjänster bakom deras
# API-gateway vill ha "oauth2", som växlar in uppgifterna mot en token
# och cachar den i KV.
LANTMATERIET_AUTH = "basic"

# Hemligheter (sätts i dashboarden eller med `wrangler secret put`,
# ALDRIG här):
#   ANTHROPIC_API_KEY
#   LANTMATERIET_CLIENT_ID
#   LANTMATERIET_CLIENT_SECRET
